<!-- [Follow Images Mouse] -->

<script>
document.addEventListener("DOMContentLoaded", function () {
  const section = document.querySelector(".section_cursus_home");
  const cmsItems = document.querySelectorAll(".mouse-image-item img");

  if (!section || cmsItems.length === 0) return;

  const images = Array.from(cmsItems).map(img => img.src);
  let currentIndex = 0;
  let lastX = 0, lastY = 0;
  let totalDistance = 0;
  let idleTimeout;
  let ghosts = [];
  let lastScrollY = window.scrollY;
  let mouseInside = false;
  let scrollImageActive = false; // ← verrou pour image de scroll

  function createGhostImage(src, x, y, isScroll = false) {
    const ghost = document.createElement("img");
    ghost.src = src;
    ghost.classList.add("floating-image");

    const rotation = (Math.random() * 20) - 10;
    const baseTransform = `translate(${x + 20}px, ${y + 20}px) rotate(${rotation}deg)`;

    ghost.style.transform = `${baseTransform} scale(0.95)`;
    ghost.style.opacity = "1";
    ghost.style.zIndex = "10";
    ghost.style.position = "fixed";
    ghost.style.left = "0";
    ghost.style.top = "0";
    ghost.style.pointerEvents = "none";
    ghost.style.transition = "opacity 0.3s ease, transform 0.5s ease-out";

    document.body.appendChild(ghost);
    ghosts.push(ghost);

    setTimeout(() => {
      ghost.style.transform = `${baseTransform} scale(1)`;
    }, 10);

    while (ghosts.length > 4) {
      const old = ghosts.shift();
      old.style.opacity = "0";
      setTimeout(() => old.remove(), 300);
    }

    const isLatest = (ghosts.length === 4);
    const duration = isLatest ? 2000 : 300;

    setTimeout(() => {
      ghost.style.opacity = "0";
      setTimeout(() => {
        ghost.remove();
        ghosts = ghosts.filter(g => g !== ghost);

        // 🔓 Libère le verrou si c'était une image scroll
        if (isScroll) scrollImageActive = false;
      }, 300);
    }, duration);
  }

  function resetIdleTimer() {
    clearTimeout(idleTimeout);
    idleTimeout = setTimeout(() => {
      ghosts.forEach(ghost => {
        ghost.style.opacity = "0";
        setTimeout(() => ghost.remove(), 300);
      });
      ghosts = [];
    }, 1000);
  }

  section.addEventListener("mousemove", function (e) {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    totalDistance += Math.sqrt(dx * dx + dy * dy);
    lastX = e.clientX;
    lastY = e.clientY;

    resetIdleTimer();

    if (totalDistance > 100) {
      currentIndex = (currentIndex + 1) % images.length;
      createGhostImage(images[currentIndex], e.clientX, e.clientY);
      totalDistance = 0;
    }
  });

  section.addEventListener("mouseenter", (e) => {
    mouseInside = true;
    lastX = e.clientX;
    lastY = e.clientY;
    resetIdleTimer();
  });

  section.addEventListener("mouseleave", () => {
    mouseInside = false;
    clearTimeout(idleTimeout);
    ghosts.forEach(ghost => {
      ghost.style.opacity = "0";
      setTimeout(() => ghost.remove(), 300);
    });
    ghosts = [];
  });

  // 🆕 Scroll déclencheur avec verrou
  window.addEventListener("scroll", () => {
    if (!mouseInside || scrollImageActive) return;

    const scrollDelta = Math.abs(window.scrollY - lastScrollY);
    lastScrollY = window.scrollY;

    if (scrollDelta > 5) {
      scrollImageActive = true;
      currentIndex = (currentIndex + 1) % images.length;
      createGhostImage(images[currentIndex], lastX, lastY, true);
      resetIdleTimer();
    }
  });
});
</script>


<!-- [Horizontal Scroll Specialisations] -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    gsap.registerPlugin(ScrollTrigger);

    const container = document.querySelector(".list-programme-home");
    const section = document.querySelector(".horizontal-scroll-section");
    const lastCard = container.lastElementChild;
    const images = gsap.utils.toArray(".card-programme .img-cover");

    const scrollWidth = container.scrollWidth;
    const viewportWidth = window.innerWidth;
    const lastCardWidth = lastCard.offsetWidth;

    // 🔧 Allonge la durée du scroll en ajoutant + de marge à droite
    const scrollDistance = scrollWidth - viewportWidth + lastCardWidth * 1;

    const totalImages = images.length;

    gsap.to(container, {
      x: () => -scrollDistance,
      ease: "none",
      scrollTrigger: {
        trigger: section,
        start: "top top",
        end: () => `+=${scrollDistance}`,
        scrub: true,
        pin: true,
        anticipatePin: 1,
        onUpdate: self => {
          const progress = self.progress;

          images.forEach((img, i) => {
            const positionRatio = i / (totalImages - 1);
            const strength = 1 - positionRatio;
            const targetX = progress * 60 * strength;

            if (!img._currentX) img._currentX = 0;
            img._currentX += (targetX - img._currentX) * 0.1;

            gsap.set(img, {
              x: img._currentX
            });
          });
        }
      }
    });
  });
</script>

<!-- [Launch Video Home] -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const playBtn = document.querySelector(".icon-play");
    const filter = document.querySelector(".filter");
    const video = document.querySelector("#campus-video");
    const container = document.querySelector(".container-video-campus");

    playBtn.addEventListener("click", function () {
      // Revenir au début de la vidéo et la jouer
      video.currentTime = 0;
      video.play();

      // Transition du bouton et du filtre
      playBtn.classList.add("fade-out");
      filter.classList.add("fade-out");
    });

    // Observer si le container sort du viewport
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) {
          video.pause();
          video.currentTime = 0;
          playBtn.classList.remove("fade-out");
          filter.classList.remove("fade-out");
        }
      });
    }, {
      threshold: 0.1 // quand moins de 10% de la div est visible
    });

    observer.observe(container);
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".title-featured-actu").forEach((el) => {
    if (el.dataset.boldified === "1") return;
    el.dataset.boldified = "1";

    // Récupère le texte pur (les * inclus)
    const raw = el.textContent || "";
    const parts = raw.split("*");
    if (parts.length < 3) return; // pas de paire *...*

    // Vérifie la graisse actuelle pour créer un contraste si nécessaire
    const currentWeight = parseInt(getComputedStyle(el).fontWeight, 10);
    const needsContrast = !isNaN(currentWeight) && currentWeight >= 600;
    if (needsContrast) {
      el.classList.add("tf-base-normal"); // ramène le titre à 400
    }

    // Reconstruit le contenu : texte normal / segment bold alternés
    const frag = document.createDocumentFragment();
    let makeBold = false;
    for (let i = 0; i < parts.length; i++) {
      const segment = parts[i];
      if (segment) {
        if (makeBold) {
          const s = document.createElement("span");
          s.className = "bolded-actu";
          s.textContent = segment;
          frag.appendChild(s);
        } else {
          frag.appendChild(document.createTextNode(segment));
        }
      }
      // Chaque séparation provenait d'un astérisque
      if (i < parts.length - 1) makeBold = !makeBold;
    }

    // Remplace le contenu (les * disparaissent, c’est attendu)
    el.innerHTML = "";
    el.appendChild(frag);
  });
});
</script>
